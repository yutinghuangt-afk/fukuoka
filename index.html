    <style>
        :root {
            --color-deep-blue: #1F3864;
            --color-cream: #F9F6F0;
            --color-warm-orange: #C55A11;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--color-cream);
            color: var(--color-deep-blue);
        }
        .nav-active {
            border-bottom: 3px solid var(--color-warm-orange);
            color: var(--color-warm-orange);
            font-weight: bold;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .timeline-item {
            position: relative;
            padding-left: 2rem;
            border-left: 2px solid var(--color-warm-orange);
            margin-bottom: 1.5rem;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -9px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--color-warm-orange);
            border: 3px solid white;
        }
        .btn-primary {
            background-color: var(--color-deep-blue);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-orange {
            background-color: var(--color-warm-orange);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }
        .section-hidden {
            display: none;
        }
        .magazine-title {
            position: relative;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-top: 2px solid var(--color-deep-blue);
            border-bottom: 2px solid var(--color-deep-blue);
            letter-spacing: 0.1em;
        }
        .map-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            background: var(--color-deep-blue);
            color: white;
            border-radius: 20px;
            font-size: 13px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .map-btn:hover {
            opacity: 0.85;
        }
        /* 排序按鈕樣式 */
        .sort-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.15s;
        }
        .sort-btn:hover {
            background: #f3f4f6;
        }
        .sort-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }
        /* 可收合的補充說明（預設收起，手機上才不會被灌爆） */
        details.notes > summary {
            list-style: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        details.notes > summary::-webkit-details-marker { display: none; }
        details.notes .toggle-label::after { content: '點開 ▾'; }
        details.notes[open] .toggle-label::after { content: '收合 ▴'; }
        /* 集合／硬底線：紅點紅字 */
        .timeline-item.is-key::before { background: #dc2626; }
        /* 移動：灰點、整列淡化 */
        .timeline-item.is-move::before { background: #d1d5db; width: 10px; height: 10px; left: -6px; }
        .timeline-item.is-move { border-left-style: dashed; }
        /* 手機：時間軸收窄、字距收緊 */
        @media (max-width: 767px) {
            .timeline-item {
                padding-left: 1.1rem;
                margin-bottom: 0.9rem;
            }
            .timeline-item::before {
                width: 12px; height: 12px; left: -7px;
            }
            .note-list li { font-size: 13px; line-height: 1.65; }
        }
    </style>

                { name: "金賞可樂餅", area: "由布院", cat: "小食", desc: "由布院日本第一名可樂餅，外酥內軟。不吃牛可選馬鈴薯／起司口味。", reserve: false, mapUrl: "https://www.google.com/maps/search/金賞コロッケ+由布院" },
                { name: "telato抹茶冰淇淋", area: "由布院", cat: "甜點", desc: "抹茶濃度1–5級義式冰淇淋，全體OK。湯之坪街道必吃甜點。", reserve: false, mapUrl: "https://www.google.com/maps/search/telato+由布院" },
                { name: "Milch半熟起司蛋糕", area: "由布院", cat: "甜點", desc: "由布院名物半熟起司蛋糕，冷熱皆可，適合邊走邊吃。", reserve: false, mapUrl: "https://www.google.com/maps/search/Milch+由布院" },
                { name: "暖暮拉麵", area: "太宰府", cat: "拉麵", desc: "曾獲九州拉麵總選舉第一名的豚骨拉麵。※五角形「合格拉麵」是一蘭太宰府参道店的限定（全世界唯一一家），不是暖暮。", reserve: false, mapUrl: "https://www.google.com/maps/search/暖暮拉麵+太宰府" },
                { name: "焼肉ベンジャミン", area: "藥院・八女", cat: "燒肉", desc: "10/3晚餐 ✅已預約（19:00）。有豚バラ可供不吃牛的人。⚠️ 菜單有ホルモン（內臟），點餐時避開。營業16:00–24:00。", reserve: true, mapUrl: "https://www.google.com/maps/search/焼肉ベンジャミン+福岡" },
                { name: "The Full Full Hakata", area: "博多・天神", cat: "麵包", desc: "最後一天必買！招牌明太子法國麵包，排隊名店，近博多站。", reserve: false, mapUrl: "https://www.google.com/maps/search/The+Full+Full+Hakata" },
                { name: "努努雞", area: "博多・天神", cat: "小食", desc: "福岡傳奇！冰著吃的炸雞，鹹甜口味，博多特色伴手禮。百貨公司購買。", reserve: false, mapUrl: "https://www.google.com/maps/search/奴奴鶏+福岡" },
                { name: "福砂屋長崎蛋糕", area: "博多・天神", cat: "甜點", desc: "底部砂糖顆粒是精華，道地長崎蛋糕，伴手禮首選。", reserve: false, mapUrl: "https://www.google.com/maps/search/福砂屋+博多" },
                { name: "iiTo TENJIN（ワンビル B1）", area: "博多・天神", cat: "美食廳", desc: "天神最大美食廳，450席、8間餐廳可自由混點同桌共食。每個人各點各的，忌口分歧直接歸零 — 8人團的保底方案。", reserve: false, mapUrl: "https://www.google.com/maps/search/iiTo+TENJIN+ONE+FUKUOKA+BLDG" },
                { name: "梅ヶ枝餅（参道30+家）", area: "太宰府", cat: "小食", desc: "太宰府第一名物。糯米＋粳米外皮包紅豆餡現烤，¥150 全參道同價。各家風味略有不同，邊逛邊比較就是玩法。散策きっぷ可換2個。✅ 無牛無海鮮無內臟", reserve: false, mapUrl: "https://www.google.com/maps/search/梅ヶ枝餅+太宰府参道" },
                { name: "筑紫庵 本店", area: "太宰府", cat: "小食", desc: "太宰府バーガー ¥500，糸島產地雞唐揚＋梅干。另有ゆず塩からあげ、合格祈願バーガー。在參道旁的支路走進去。✅ 雞肉，不吃牛也OK — 参道唯一的鹹食主力", reserve: false, mapUrl: "https://www.google.com/maps/search/筑紫庵+太宰府" },
                { name: "&Myuu.chocolaterie", area: "太宰府", cat: "甜點", desc: "招牌可可銅鑼燒，可單手享用、乾爽不沾手 — 穿和服最安全的一款。另售一口尺寸 Bonbon Chocolat 與紅寶石巧克力，適合當伴手禮", reserve: false, mapUrl: "https://www.google.com/maps/search/Myuu+chocolaterie+太宰府" },
                { name: "太宰府参道 天山", area: "太宰府", cat: "甜點", desc: "招牌鬼瓦最中（最中皮包紅豆餡，乾爽好拿）與蕨餅，常排長龍。⚠️ 甘王草莓大福最中是冬季限定，10月沒有", reserve: false, mapUrl: "https://www.google.com/maps/search/太宰府参道+天山" },
                { name: "太宰府SUGIRU", area: "太宰府", cat: "飲料", desc: "韓國料理與香蕉牛奶。香蕉牛奶完全不加調味料、每杯現做，強調「20分內最好喝完」。韓式辣醬炸雞也很受歡迎 ✅ 雞肉", reserve: false, mapUrl: "https://www.google.com/maps/search/太宰府+SUGIRU+バナナジュース" },
                { name: "AMARILLO", area: "太宰府", cat: "甜點", desc: "九州首間以卡達拉娜（Crema Catalana）為主題的甜點店，甜點品項多樣，做成杯裝很適合邊走邊吃，也可內用", reserve: false, mapUrl: "https://www.google.com/maps/search/AMARILLO+太宰府" },
                { name: "チーズケーキ研究所", area: "太宰府", cat: "甜點", desc: "隱藏版人氣甜點店。濃郁綿密的起司蛋糕，店內常備7–8種，可內用也可外帶切片。季節聖代也很受歡迎", reserve: false, mapUrl: "https://www.google.com/maps/search/チーズケーキ研究所+太宰府" },
                { name: "Kingberry", area: "太宰府", cat: "甜點", desc: "甘王草莓甜點專門店，從濃縮果汁、果粒果凍、蛋糕到招牌冰淇淋全採 100% 新鮮あまおう。⚠️ 10月初非草莓產季，品項可能受限，現場確認", reserve: false, mapUrl: "https://www.google.com/maps/search/Kingberry+太宰府" },
                { name: "小鳥居茶房", area: "太宰府", cat: "甜點", desc: "超過百年歷史的古民家改造而成。招牌生布丁冰淇淋：香濃卡士達冰淇淋配焦糖醬，口感Q彈。⚠️ 會滴，穿和服請站著吃完再走", reserve: false, mapUrl: "https://www.google.com/maps/search/小鳥居茶房+太宰府" },
                { name: "toffee", area: "太宰府", cat: "甜點", desc: "冰淇淋櫃品項豐富，從香草、抹茶到各式水果口味，招牌是加了脆梅的梅子冰淇淋，另有季節限定聖代。⚠️ 會滴，穿和服請站著吃完", reserve: false, mapUrl: "https://www.google.com/maps/search/toffee+太宰府" },
                { name: "ひろしょう", area: "太宰府", cat: "小食", desc: "明太燒賣、明太肉包，以及與ろじ屋合作的明太高湯煎蛋捲串 — 外層印有太宰府烙印，串著吃非常方便。⚠️ 明太子＝魚卵，不吃海鮮的那位避開", reserve: false, mapUrl: "https://www.google.com/maps/search/ひろしょう+太宰府" },
                { name: "ふくや 太宰府店", area: "太宰府", cat: "小食", desc: "明太子茶泡飯，一個銅板價，熱冷兩種可選。微辣明太子配帶勁的山葵，份量剛好。⚠️ 明太子＝魚卵；且有湯汁，穿和服時不建議", reserve: false, mapUrl: "https://www.google.com/maps/search/ふくや+太宰府" },
                { name: "YAMAYA BASE DAZAIFU", area: "太宰府", cat: "麵包", desc: "明太法棍，內餡用大量無色素明太子，點餐後再進烤箱加熱一次，很適合邊走邊吃。⚠️ 明太子＝魚卵。合格印限定款是11月–2月底，10月沒有", reserve: false, mapUrl: "https://www.google.com/maps/search/YAMAYA+BASE+DAZAIFU" },
                { name: "福太郎 太宰府店", area: "太宰府", cat: "小食", desc: "明太子仙貝名店的太宰府店舖，招牌散步美食是經常售罄的明太烤飯糰，店內也展示多款明太子加工商品。⚠️ 明太子＝魚卵", reserve: false, mapUrl: "https://www.google.com/maps/search/福太郎+太宰府" },
                { name: "揚子江 太宰府店", area: "太宰府", cat: "小食", desc: "太宰府站附近，福岡代表性肉包名店，天天大排長龍。吃到一半加點醋醬油更好吃。⚠️「咬下去肉汁四溢」— 穿和服請避開，還完和服再買", reserve: false, mapUrl: "https://www.google.com/maps/search/揚子江+太宰府" },
                { name: "かさの家", area: "太宰府", cat: "甜點", desc: "大正11年（1922）創業的老舖。抹茶セット（附梅ヶ枝餅1個）¥650，想坐下休息時來。⚠️ 梅ヶ枝餅排隊最誇張，店家派專人舉「かさの家最後尾」的牌子", reserve: false, mapUrl: "https://www.google.com/maps/search/かさの家+太宰府" },
                { name: "陽だまり食堂", area: "由布院", cat: "定食", desc: "JA大分ゆふいん直營農產直賣所內，就在由布院車站旁 — 12:27下車立刻能吃，位在散策動線起點。在地媽媽做的鄉土料理，不用化學調味料。陽だまり定食¥1,080（だんご汁＋とり天）／とり天定食¥864／だんご汁定食¥756／ハヤシライス定食¥864／豐後牛丼¥864。11:00–15:00，只休年末年始 → 10/1確定營業。✅ とり天是雞肉，不吃牛的人完美 ⚠️ だんご汁高湯多為いりこ（小魚乾）出汁，不吃海鮮者先問「だしは魚介ですか」", reserve: false, mapUrl: "https://www.google.com/maps/search/陽だまり食堂+由布院" },
                { name: "由布まぶし 心 金鱗湖本店", area: "由布院", cat: "釜飯", desc: "招牌「由布まぶし」有豐後牛／地雞／鰻三種可選，約¥3,200 → ✅ 不吃牛的點地雞版，全團同款料理。土鍋現炊，10:30–18:30（LO 17:30）。☎0977-85-7880 ⚠️ 強烈建議預約；12:30尖峰排45分起。位置在金鱗湖端＝動線終點，選這家散策順序要調整", reserve: true, mapUrl: "https://www.google.com/maps/search/由布まぶし+心+金鱗湖本店" },
                { name: "茶房 天井棧敷", area: "由布院", cat: "咖啡", desc: "亀の井別荘內、金鱗湖旁，江戶末期造酒屋的閣樓改建，大茅草屋頂藏在樹林中，氣氛極好。9:00–17:00。⚠️ 不定休（每月約1次），8人專程去有撲空風險；且以咖啡為主不是正餐 → 當金鱗湖旁的收尾可以，別當午餐", reserve: false, mapUrl: "https://www.google.com/maps/search/茶房+天井棧敷+由布院" },
                { name: "豚かつ 吉岡", area: "藥院・八女", cat: "豬排", desc: "10/3 八女午餐推薦之一（未定案）。✅ 豬排，全團無忌口問題。11:00–14:00 ⚠️ 建議先訂位（8人）", reserve: true, mapUrl: "https://www.google.com/maps/search/豚かつ+吉岡+八女市" },
                { name: "FEELS GOOD STORE", area: "藥院・八女", cat: "咖啡", desc: "2025年8月開幕。雜貨選物店併設咖啡，one drink order制，點杯飲料就能邊喝邊逛。薬院3-12-22，薬院大通駅徒步4分｜12:00–19:00", reserve: false, mapUrl: "https://www.google.com/maps/search/FEELS+GOOD+STORE+薬院+福岡" },

                { name: "BBB POTTERS 2F 咖啡", area: "藥院・八女", cat: "咖啡", desc: "2樓咖啡由法國布列塔尼修業的甜點師主理，招牌是法式薄餅（galette）、可麗餅與聖代。薬院1-8-8，薬院大通駅2出口徒步3分｜11:00–19:00（咖啡OS 18:30） ⚠️ 19:00要吃燒肉，別吃太飽", reserve: false, mapUrl: "https://www.google.com/maps/search/BBB+POTTERS+薬院+福岡" }

                        { jp: "お会計は一緒でお願いします。", zh: "麻煩一起結帳。" }
                    ]},
                    { title: "燒肉專用（10/3 焼肉ベンジャミン）", items: [
                        { jp: "ホルモン・レバー・ミノ・ハツ・センマイ", zh: "❌ 要避開：內臟總稱／肝／胃／心／百葉" },
                        { jp: "カルビ・ロース・ハラミ・豚バラ・鶏もも・野菜盛り", zh: "✅ 可安心點：牛五花／里肌／橫膈膜／豬五花／雞腿／綜合蔬菜（不吃牛的人點豚バラ・鶏もも）" }
                    ]}
                ]
            }
        };

        // ── 資料初始化 ────────────────────────────────────────
        // 重點：畫面內容一律從 localStorage 讀，所以「檔案更新了但瀏覽器仍顯示舊內容」
        // 的原因不是快取，而是 localStorage 裡還留著上次造訪時存下的舊資料。
        // 解法：用 dataVersion 比對，只要檔案版本比本機新，就用檔案內容覆蓋。
        (function initData() {
            const raw = localStorage.getItem('fukuokaTravelData');

            // 網址帶 ?reset=1 → 強制重置成檔案最新內容
            const forceReset = new URLSearchParams(location.search).get('reset') === '1';

            if (!raw || forceReset) {
                localStorage.setItem('fukuokaTravelData', JSON.stringify(defaultData));
                return;
            }

            let saved;
            try {
                saved = JSON.parse(raw);
            } catch (e) {
                // 資料損毀 → 直接重置
                localStorage.setItem('fukuokaTravelData', JSON.stringify(defaultData));
                return;
            }

            // 版本較舊（或舊資料根本沒有版本欄位）→ 用檔案內容整份覆蓋
            const savedVer = saved.dataVersion || 0;
            if (savedVer < (defaultData.dataVersion || 0)) {
                localStorage.setItem('fukuokaTravelData', JSON.stringify(defaultData));
                return;
            }

            // 版本相同 → 沿用本機資料，僅補上缺少的欄位
            if (!saved.info.highlights) saved.info.highlights = defaultData.info.highlights;
            if (!saved.info.heroDesc)   saved.info.heroDesc   = defaultData.info.heroDesc;
            (saved.food || []).forEach((f, i) => {
                if (f.mapUrl === undefined) {
                    f.mapUrl = (defaultData.food[i] && defaultData.food[i].mapUrl) || "";
                }
            });
            localStorage.setItem('fukuokaTravelData', JSON.stringify(saved));
        })();

        // ── 勾選狀態：獨立存放，升版覆蓋資料時不會被洗掉 ──
        function getChecks() {
            try { return JSON.parse(localStorage.getItem('fukuokaChecks') || '{}'); }
            catch (e) { return {}; }
        }
        function toggleCheck(key, el) {
            const c = getChecks();
            c[key] = el.checked;
            localStorage.setItem('fukuokaChecks', JSON.stringify(c));
            el.parentElement.classList.toggle('opacity-40', el.checked);
            el.parentElement.classList.toggle('line-through', el.checked);
        }

        // ── 手動強制更新（頁尾按鈕用） ──
        function forceRefreshData() {
            if (!confirm('將以網站最新內容覆蓋這台裝置的資料，確定嗎？')) return;
            localStorage.removeItem('fukuokaTravelData');
            location.replace(location.pathname + '?v=' + Date.now());
        }

        function getData() {
            return JSON.parse(localStorage.getItem('fukuokaTravelData'));
        }
        function saveData(data) {
            localStorage.setItem('fukuokaTravelData', JSON.stringify(data));
        }

        function renderPage(pageId) {
            const data = getData();
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            if (pageId === 'home') {
                let itineraryCards = '';
                data.itinerary.forEach(day => {

                data.itinerary.forEach(day => {

                const areaIcons = { "博多・天神": "🏙️", "由布院": "♨️", "太宰府": "⛩️", "藥院・八女": "🍵" };

            } else if (pageId === 'prep') {
                const checks = getChecks();

        // ── GitHub 設定（Token 存在 localStorage，不出現在原始碼） ──
        const GITHUB_REPO  = 'yutinghuangt-afk/fukuoka';
        const GITHUB_FILE  = 'index.html';
        const GITHUB_API   = 'https://api.github.com';

        function getToken() {
            return localStorage.getItem('gh_token') || '';
        }
        function setToken(t) {
            localStorage.setItem('gh_token', t.trim());
        }

        // ── 產生新版 HTML（把 defaultData 換成最新資料） ──
        function buildNewHTML() {
            const currentData = getData();
            // 每次匯出都蓋上新版本號，訪客下次開啟時才會自動吃到最新內容
            currentData.dataVersion = Date.now();
            saveData(currentData);
            const source = document.documentElement.outerHTML;
            const newDataStr = 'const defaultData = ' + JSON.stringify(currentData, null, 12) + ';';
            const startMarker = 'const defaultData = {';
            const startIdx = source.indexOf(startMarker);
            let depth = 0, endIdx = -1, inString = false, strChar = '', escaped = false;
            for (let i = startIdx + startMarker.length - 1; i < source.length; i++) {
                const ch = source[i];
                if (escaped) { escaped = false; continue; }
                if (ch === '\\' && inString) { escaped = true; continue; }
                if (!inString && (ch === '"' || ch === "'" || ch === '`')) { inString = true; strChar = ch; continue; }
                if (inString && ch === strChar) { inString = false; continue; }
                if (inString) continue;
                if (ch === '{') { depth++; continue; }
                if (ch === '}') {
                    depth--;
                    if (depth === 0) { endIdx = source.indexOf(';', i) + 1; break; }
                }
            }
            if (startIdx === -1 || endIdx === -1) return null;
            let html = source.slice(0, startIdx) + newDataStr + source.slice(endIdx);
            if (!html.includes('<!DOCTYPE')) html = '<!DOCTYPE html>\n' + html;
            return html;
        }

        // ── 自動推送到 GitHub ──
        async function exportHTML() {
            // 1. 確認 Token
            let token = getToken();
            if (!token) {
                token = prompt('請輸入 GitHub Token（只需輸入一次，之後自動記住）：');
                if (!token) return;
                setToken(token);
            }

            // 2. 產生新 HTML
            const newHTML = buildNewHTML();
            if (!newHTML) { alert('❌ 產生 HTML 失敗，請重試。'); return; }

            // 3. 取得目前檔案的 SHA（GitHub API 更新檔案需要）
            const btn = document.querySelector('button[onclick="exportHTML()"]');
            const origText = btn ? btn.textContent : '';
            if (btn) { btn.textContent = '⏳ 更新中...'; btn.disabled = true; }

            try {
                const getRes = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getRes.status === 401) {
                    localStorage.removeItem('gh_token');
                    alert('❌ Token 無效或已過期，請重新輸入。');
                    if (btn) { btn.textContent = origText; btn.disabled = false; }
                    return;
                }
                if (!getRes.ok) throw new Error(`取得檔案失敗：${getRes.status}`);

                const fileInfo = await getRes.json();
                const sha = fileInfo.sha;

                // 4. 把 HTML 轉成 Base64
                const base64 = btoa(unescape(encodeURIComponent(newHTML)));

                // 5. 推送更新
                const putRes = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `✏️ 後台更新內容 ${new Date().toLocaleString('zh-TW')}`,
                        content: base64,
                        sha: sha
                    })
                });

                if (!putRes.ok) throw new Error(`推送失敗：${putRes.status}`);

                if (btn) { btn.textContent = '✅ 已更新！'; }
                setTimeout(() => {
                    alert('✅ 成功！\n\nGitHub Pages 約 1~2 分鐘後生效。\n請稍後重新整理網站確認。');
                    if (btn) { btn.textContent = origText; btn.disabled = false; }
                }, 300);

            } catch (err) {
                alert('❌ 更新失敗：' + err.message);
                if (btn) { btn.textContent = origText; btn.disabled = false; }
            }
        }

        window.onload = () => { showPage('home'); };
    </script>
