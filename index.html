    <style>
        :root {
            --color-deep-blue: #1F3864;
            --color-cream: #F9F6F0;
            --color-warm-orange: #C55A11;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--color-cream);
            color: var(--color-deep-blue);
        }
        .nav-active {
            border-bottom: 3px solid var(--color-warm-orange);
            color: var(--color-warm-orange);
            font-weight: bold;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .timeline-item {
            position: relative;
            padding-left: 2rem;
            border-left: 2px solid var(--color-warm-orange);
            margin-bottom: 1.5rem;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -9px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--color-warm-orange);
            border: 3px solid white;
        }
        .btn-primary {
            background-color: var(--color-deep-blue);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-orange {
            background-color: var(--color-warm-orange);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }
        .section-hidden {
            display: none;
        }
        .magazine-title {
            position: relative;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-top: 2px solid var(--color-deep-blue);
            border-bottom: 2px solid var(--color-deep-blue);
            letter-spacing: 0.1em;
        }
        .map-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            background: var(--color-deep-blue);
            color: white;
            border-radius: 20px;
            font-size: 13px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .map-btn:hover {
            opacity: 0.85;
        }
        /* 排序按鈕樣式 */
        .sort-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.15s;
        }
        .sort-btn:hover {
            background: #f3f4f6;
        }
        .sort-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        // ── 資料初始化 ────────────────────────────────────────
        // 重點：畫面內容一律從 localStorage 讀，所以「檔案更新了但瀏覽器仍顯示舊內容」
        // 的原因不是快取，而是 localStorage 裡還留著上次造訪時存下的舊資料。
        // 解法：用 dataVersion 比對，只要檔案版本比本機新，就用檔案內容覆蓋。
        (function initData() {
            const raw = localStorage.getItem('fukuokaTravelData');

            // 網址帶 ?reset=1 → 強制重置成檔案最新內容
            const forceReset = new URLSearchParams(location.search).get('reset') === '1';

            if (!raw || forceReset) {
                localStorage.setItem('fukuokaTravelData', JSON.stringify(defaultData));
                return;
            }

            let saved;
            try {
                saved = JSON.parse(raw);
            } catch (e) {
                // 資料損毀 → 直接重置
                localStorage.setItem('fukuokaTravelData', JSON.stringify(defaultData));
                return;
            }

            // 版本較舊（或舊資料根本沒有版本欄位）→ 用檔案內容整份覆蓋
            const savedVer = saved.dataVersion || 0;
            if (savedVer < (defaultData.dataVersion || 0)) {
                localStorage.setItem('fukuokaTravelData', JSON.stringify(defaultData));
                return;
            }

            // 版本相同 → 沿用本機資料，僅補上缺少的欄位
            if (!saved.info.highlights) saved.info.highlights = defaultData.info.highlights;
            if (!saved.info.heroDesc)   saved.info.heroDesc   = defaultData.info.heroDesc;
            (saved.food || []).forEach((f, i) => {
                if (f.mapUrl === undefined) {
                    f.mapUrl = (defaultData.food[i] && defaultData.food[i].mapUrl) || "";
                }
            });
            localStorage.setItem('fukuokaTravelData', JSON.stringify(saved));
        })();

        // ── 勾選狀態：獨立存放，升版覆蓋資料時不會被洗掉 ──
        function getChecks() {
            try { return JSON.parse(localStorage.getItem('fukuokaChecks') || '{}'); }
            catch (e) { return {}; }
        }
        function toggleCheck(key, el) {
            const c = getChecks();
            c[key] = el.checked;
            localStorage.setItem('fukuokaChecks', JSON.stringify(c));
            el.parentElement.classList.toggle('opacity-40', el.checked);
            el.parentElement.classList.toggle('line-through', el.checked);
        }

        // ── 手動強制更新（頁尾按鈕用） ──
        function forceRefreshData() {
            if (!confirm('將以網站最新內容覆蓋這台裝置的資料，確定嗎？')) return;
            localStorage.removeItem('fukuokaTravelData');
            location.replace(location.pathname + '?v=' + Date.now());
        }

        function getData() {
            return JSON.parse(localStorage.getItem('fukuokaTravelData'));
        }
        function saveData(data) {
            localStorage.setItem('fukuokaTravelData', JSON.stringify(data));
        }

        function renderPage(pageId) {
            const data = getData();
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            if (pageId === 'home') {
                let itineraryCards = '';
                data.itinerary.forEach(day => {
                    itineraryCards += `
                        <div class="card p-4 flex flex-col justify-between">
                            <div>
                                <h4 class="font-bold text-orange-700">Day ${day.day}</h4>
                                <p class="text-sm text-gray-500 mb-2">${day.date}</p>
                                <p class="font-medium">${day.title}</p>
                            </div>
                            <button onclick="showPage('itinerary')" class="mt-4 text-xs text-blue-600 hover:underline text-right">查看詳情 →</button>
                        </div>
                    `;
                });

                let total = 0;
                data.itinerary.forEach(day => {
                    day.items.forEach(item => total += (item.cost || 0));
                });

                // highlights 卡片（從 data.info.highlights 動態渲染）
                const highlights = data.info.highlights || defaultData.info.highlights;
                const highlightCards = highlights.map(h => `
                    <div class="card p-6 border-t-4 border-blue-900 text-center">
                        <div class="text-3xl mb-2">${h.icon}</div>
                        <p class="text-xs text-gray-500 mb-1">${h.label}</p>
                        <p class="font-bold text-sm">${h.value}</p>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="text-center mb-12">
                        <h1 class="text-4xl md:text-5xl font-bold mb-4 magazine-title">${data.info.title}</h1>
                        <p class="text-xl text-gray-600 mb-4">${data.info.subtitle}</p>
                        <p class="text-gray-500 max-w-xl mx-auto">${data.info.heroDesc || ''}</p>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">
                        ${highlightCards}
                    </div>
                    <h2 class="text-2xl font-bold mb-6 flex items-center">
                        <span class="w-8 h-8 bg-blue-900 text-white rounded-full flex items-center justify-center mr-2 text-sm">01</span>

        // ── 共用：HTML 特殊字元跳脫（防止引號破壞 input value） ──
        function escHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // ── 首頁 info 更新 ──
        function updateInfo(field, value) {

        function updateHighlight(idx, field, value) {
            const data = getData();

            data.info.highlights[idx][field] = value;
            saveData(data);
        }

        // ── 通用排序（attractions / food） ──
        function moveItem(listKey, idx, direction) {
            const data = getData();
            const list = data[listKey];
            const target = idx + direction;
            if (target < 0 || target >= list.length) return;
            // 交換
            [list[idx], list[target]] = [list[target], list[idx]];
            saveData(data);
            renderAdminSection(listKey);
        }

        // ── 行程管理 ──
        function updateItinerary(dayIdx, itemIdx, field, value) {
            const data = getData();
            if (field === 'cost') value = parseInt(value) || 0;
            data.itinerary[dayIdx].items[itemIdx][field] = value;
            saveData(data);
        }
        function addItineraryItem(dayIdx) {
            const data = getData();
            data.itinerary[dayIdx].items.push({ time: "00:00", event: "新項目", cost: 0 });
            saveData(data);
            renderAdminSection('itinerary');
        }
        function deleteItineraryItem(dayIdx, itemIdx) {
            if (!confirm('確定刪除？')) return;
            const data = getData();
            data.itinerary[dayIdx].items.splice(itemIdx, 1);

            renderAdminSection('itinerary');

        }
        function addAttraction() {
            const data = getData();
            data.attractions.push({ name: "新景點", desc: "請輸入說明", tag: "標籤", mapUrl: "" });

            const data = getData();
            data.food.push({ name: "新餐廳", cat: "類別", desc: "說明", reserve: false, mapUrl: "" });
            saveData(data);
            renderAdminSection('food');
        }
        function deleteFood(idx) {
            if (!confirm('確定刪除？')) return;

            data.food.splice(idx, 1);
            saveData(data);

        // ── 待辦管理 ──
        function updateTodo(idx, field, value) {

        // ── 導覽 ──
        function showPage(pageId) {

            if (activeNav) activeNav.classList.add('nav-active');
            renderPage(pageId);
        }
        function checkAdminLogin() {
            if (sessionStorage.getItem('isAdmin') === 'true') {
                showPage('admin');
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        }
        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }
        function login() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            if (user === 'fukuoka2026' && pass === 'travel8people') {
                sessionStorage.setItem('isAdmin', 'true');
                closeLoginModal();
                showPage('admin');
            } else {
                alert('帳號或密碼錯誤');
            }
        }

        // ── GitHub 設定（Token 存在 localStorage，不出現在原始碼） ──
        const GITHUB_REPO  = 'yutinghuangt-afk/fukuoka';
        const GITHUB_FILE  = 'index.html';
        const GITHUB_API   = 'https://api.github.com';

        function getToken() {
            return localStorage.getItem('gh_token') || '';
        }
        function setToken(t) {
            localStorage.setItem('gh_token', t.trim());
        }

        // ── 產生新版 HTML（把 defaultData 換成最新資料） ──
        function buildNewHTML() {
            const currentData = getData();
            // 每次匯出都蓋上新版本號，訪客下次開啟時才會自動吃到最新內容
            currentData.dataVersion = Date.now();
            saveData(currentData);
            const source = document.documentElement.outerHTML;
            const newDataStr = 'const defaultData = ' + JSON.stringify(currentData, null, 12) + ';';
            const startMarker = 'const defaultData = {';
            const startIdx = source.indexOf(startMarker);
            let depth = 0, endIdx = -1, inString = false, strChar = '', escaped = false;
            for (let i = startIdx + startMarker.length - 1; i < source.length; i++) {
                const ch = source[i];
                if (escaped) { escaped = false; continue; }
                if (ch === '\\' && inString) { escaped = true; continue; }
                if (!inString && (ch === '"' || ch === "'" || ch === '`')) { inString = true; strChar = ch; continue; }
                if (inString && ch === strChar) { inString = false; continue; }
                if (inString) continue;
                if (ch === '{') { depth++; continue; }
                if (ch === '}') {
                    depth--;
                    if (depth === 0) { endIdx = source.indexOf(';', i) + 1; break; }
                }
            }
            if (startIdx === -1 || endIdx === -1) return null;
            let html = source.slice(0, startIdx) + newDataStr + source.slice(endIdx);
            if (!html.includes('<!DOCTYPE')) html = '<!DOCTYPE html>\n' + html;
            return html;
        }

        // ── 自動推送到 GitHub ──
        async function exportHTML() {
            // 1. 確認 Token
            let token = getToken();
            if (!token) {
                token = prompt('請輸入 GitHub Token（只需輸入一次，之後自動記住）：');
                if (!token) return;
                setToken(token);
            }

            // 2. 產生新 HTML
            const newHTML = buildNewHTML();
            if (!newHTML) { alert('❌ 產生 HTML 失敗，請重試。'); return; }

            // 3. 取得目前檔案的 SHA（GitHub API 更新檔案需要）
            const btn = document.querySelector('button[onclick="exportHTML()"]');
            const origText = btn ? btn.textContent : '';
            if (btn) { btn.textContent = '⏳ 更新中...'; btn.disabled = true; }

            try {
                const getRes = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getRes.status === 401) {
                    localStorage.removeItem('gh_token');
                    alert('❌ Token 無效或已過期，請重新輸入。');
                    if (btn) { btn.textContent = origText; btn.disabled = false; }
                    return;
                }
                if (!getRes.ok) throw new Error(`取得檔案失敗：${getRes.status}`);

                const fileInfo = await getRes.json();
                const sha = fileInfo.sha;

                // 4. 把 HTML 轉成 Base64
                const base64 = btoa(unescape(encodeURIComponent(newHTML)));

                // 5. 推送更新
                const putRes = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `✏️ 後台更新內容 ${new Date().toLocaleString('zh-TW')}`,
                        content: base64,
                        sha: sha
                    })
                });

                if (!putRes.ok) throw new Error(`推送失敗：${putRes.status}`);

                if (btn) { btn.textContent = '✅ 已更新！'; }
                setTimeout(() => {
                    alert('✅ 成功！\n\nGitHub Pages 約 1~2 分鐘後生效。\n請稍後重新整理網站確認。');
                    if (btn) { btn.textContent = origText; btn.disabled = false; }
                }, 300);

            } catch (err) {
                alert('❌ 更新失敗：' + err.message);
                if (btn) { btn.textContent = origText; btn.disabled = false; }
            }
        }

        window.onload = () => { showPage('home'); };
    </script>
